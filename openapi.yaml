openapi: 3.0.0
info:
  title: Система архивирования
  version: 1.0.0

x-yc-apigateway:
  service_account_id: '${gateway_account_id}'

paths:
  /tasks:
    post:
      operationId: createTask
      summary: Поставить задание на архивирование
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      x-yc-apigateway-validator:
        validateRequestBody: true
      x-yc-apigateway-integration:
        type: cloud_ymq
        action: SendMessage
        folder_id: '${folder_id}'
        queue_url: '${tasks_queue_url}'
        payload_format_type: body
      responses:
        '200':
          description: Сообщение принято очередью
          x-yc-status-mapping: 202
        '202':
          description: Задание принято к фоновой обработке
        '400':
          description: Некорректное тело задания

  /archives:
    get:
      operationId: listArchives
      summary: Получить список архивов
      x-yc-apigateway-integration:
        type: cloud_ydb
        action: Scan
        database: '${database_path}'
        table_name: '${archive_table}'
      responses:
        '200':
          description: Массив архивов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Archive'

  /archives/{key}:
    get:
      operationId: getArchive
      summary: Получить метаданные архива
      parameters:
        - $ref: '#/components/parameters/ArchiveKey'
      x-yc-apigateway-validator:
        validateRequestParameters: true
        validateResponseBody: true
        validationErrorHandler:
          statusCode: 404
          x-yc-apigateway-integration:
            type: dummy
            http_code: 200
            http_headers:
              Content-Type: application/json
            content:
              application/json: '{"message":"Archive not found"}'
      x-yc-apigateway-integration:
        type: cloud_ydb
        action: GetItem
        database: '${database_path}'
        table_name: '${archive_table}'
        key: '{"${archive_key}": "{key}"}'
      responses:
        '200':
          description: Метаданные архива
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archive'
        '404':
          description: Архив не найден

  /download/{key}:
    get:
      operationId: downloadArchive
      summary: Скачать ZIP-архив
      parameters:
        - $ref: '#/components/parameters/ArchiveKey'
      x-yc-apigateway-validator:
        validateRequestParameters: true
        validationErrorHandler:
          statusCode: 404
          x-yc-apigateway-integration:
            type: dummy
            http_code: 200
            http_headers:
              Content-Type: application/json
            content:
              application/json: '{"message":"Archive not found"}'
      x-yc-apigateway-integration:
        type: object_storage
        bucket: '${bucket_name}'
        object: '{key}'
      responses:
        '200':
          description: ZIP-архив
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: Архив не найден

components:
  parameters:
    ArchiveKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        maxLength: 255
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'

  schemas:
    Task:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^/\\:\x00-\x1F]+$'
          not:
            enum: ['.', '..']
        url:
          type: string
          format: uri
          pattern: '^[Hh][Tt][Tt][Pp][Ss]?://[^/?#\s@]+([/?#]\S*)?$'
    Archive:
      type: object
      required: [name, url, key]
      properties:
        name:
          type: string
        url:
          type: string
        key:
          type: string
